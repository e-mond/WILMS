name: Apply Database Migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Database target'
        required: true
        type: choice
        options:
          - production
          - staging

concurrency:
  group: apply-db-migrations-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify DATABASE_URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set on the GitHub environment '${{ inputs.target }}'."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ inputs.target == 'production' && secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL }}

      - name: Apply pending migrations
        run: node scripts/apply-pending-migrations.mjs
        env:
          DATABASE_URL: ${{ inputs.target == 'production' && secrets.DATABASE_URL || secrets.STAGING_DATABASE_URL }}

      - name: Summarise
        run: echo "Migrations applied for ${{ inputs.target }}"
